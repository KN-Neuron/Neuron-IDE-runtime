jobs:
  # Publishes ci/Dockerfile to ghcr.io under the file's git hash, once per version of the file, so
  # every job (and anyone who pulls that tag) runs with exactly the same tools.
  ci-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Pick the image tag
      id: tag
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-ci:$(git hash-object ci/Dockerfile)" >> "$GITHUB_OUTPUT"

    - name: Log in to ghcr.io
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Build and push the image unless it already exists
      env:
        IMAGE: ${{ steps.tag.outputs.image }}
      run: |
        if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
          echo "$IMAGE already exists."
        else
          docker build -t "$IMAGE" ci
          docker push "$IMAGE"
        fi

  build-and-test:
    needs: ci-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check Code Formatting
      run: |
        find src include tests -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) | xargs clang-format-20 --dry-run -Werror

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEURON_IDE_ENABLE_COVERAGE=ON -DNEURON_IDE_ENABLE_CLANG_TIDY=OFF

    - name: Build
      run: cmake --build build --parallel

    - name: Run Tests & Check Coverage
      run: cmake --build build --target coverage

  clang-tidy:
    needs: ci-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # On pull requests HEAD is the merge commit and HEAD^1 the base branch, which the
        # changed-file list below diffs against.
        fetch-depth: 2

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNEURON_IDE_ENABLE_CLANG_TIDY=OFF

    - name: Generate protobuf headers
      run: cmake --build build --target neuronide_proto

    - name: Run clang-tidy
      run: |
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && git diff --quiet HEAD^1 HEAD -- .clang-tidy; then
          files=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- \
            'src/*.cpp' 'src/*.hpp' 'include/*.hpp' 'tests/*.cpp' 'tests/*.hpp')
        else
          files=$(git ls-files 'src/*.cpp' 'tests/*.cpp')
        fi
        if [ -z "$files" ]; then
          echo "No C++ files changed."
          exit 0
        fi
        echo "$files" | xargs -P "$(nproc)" -n 1 clang-tidy-20 -p build --quiet
