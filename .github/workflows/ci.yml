jobs:
  # Publishes ci/Dockerfile to ghcr.io under the file's git hash, once per version of the file, so
  # every job (and ci/run-locally.sh) runs with exactly the same tools. The build gets no context,
  # so nothing but the Dockerfile can change the image.
  ci-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Pick the image tag
      id: tag
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-ci:$(git hash-object ci/Dockerfile)" >> "$GITHUB_OUTPUT"

    - name: Log in to ghcr.io
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Build and push the image unless it already exists
      env:
        IMAGE: ${{ steps.tag.outputs.image }}
      run: |
        if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
          echo "$IMAGE already exists."
        else
          docker build -t "$IMAGE" - < ci/Dockerfile
          docker push "$IMAGE"
        fi

  build-and-test:
    needs: ci-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check Code Formatting
      run: ci/checks.sh format

    - name: Build, Run Tests & Check Coverage
      run: ci/checks.sh test

  clang-tidy:
    needs: ci-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # On pull requests HEAD is the merge commit and HEAD^1 the base branch, which clang-tidy
        # takes its changed files from. Pushes check every file.
        fetch-depth: 2

    - name: Run clang-tidy
      run: ci/checks.sh tidy ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
